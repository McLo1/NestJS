services:
  postgres:
    image: postgres:16
    container_name: igreja-postgres

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=igreja_db

    ports:
      - "5433:5432"

    volumes:
      - igreja_postgres_data:/var/lib/postgresql/data

volumes:
  igreja_postgres_data: